name: Publish reviewed app content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile-app/src/content/**"
      - "mobile-app/scripts/build-content.mjs"
      - "mobile-app/scripts/validate-content.mjs"
      - ".github/workflows/content-publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mobile-app
      - run: pnpm content:build
        working-directory: mobile-app
      - run: pnpm content:validate
        working-directory: mobile-app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-app/public
      - name: Deploy reviewed static content
        id: deployment
        uses: actions/deploy-pages@v4
